name: Env Secret Scan

on:
  pull_request:
    paths:
      - '.env*'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.env*'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  secret-scan:
    name: Scan tracked .env files for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan .env files for high-entropy secret patterns
        run: |
          ENV_FILES=$(git ls-files '.env*')
          if [[ -z "$ENV_FILES" ]]; then
            echo "No tracked .env files found."
            exit 0
          fi

          FOUND=0
          # Patterns that indicate real credentials (not placeholders)
          SECRET_PATTERNS=(
            'sk_live_[A-Za-z0-9]'
            'sk_test_[A-Za-z0-9]'
            'rk_live_[A-Za-z0-9]'
            'AKIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9]{36}'
            'gho_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9]{22}'
            'xox[baprs]-[A-Za-z0-9]'
            '-----BEGIN.*PRIVATE KEY-----'
            'eyJhbGciOi[A-Za-z0-9_-]+\.eyJ'
            'postgres(ql)?://[^:]+:[^@]+@'
            'redis://:[^@]+@'
            'mongodb(\+srv)?://[^:]+:[^@]+@'
          )

          for file in $ENV_FILES; do
            for pattern in "${SECRET_PATTERNS[@]}"; do
              if grep -qE "$pattern" "$file" 2>/dev/null; then
                echo "❌ High-entropy secret pattern found in $file (pattern: $pattern)"
                FOUND=1
              fi
            done
          done

          if [[ "$FOUND" -eq 1 ]]; then
            echo ""
            echo "Tracked .env files must contain only placeholders — no live credentials."
            exit 1
          fi

          echo "✅ No secrets found in tracked .env files."

  script-secret-check:
    name: Check scripts and workflows for secret variable logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deny-list secret variable echo patterns
        run: |
          FOUND=0
          # Patterns that would print a secret-bearing variable to stdout/logs
          DENY_PATTERNS=(
            'echo[[:space:]].*\$DATABASE_URL'
            'echo[[:space:]].*\$REDIS_URL'
            'echo[[:space:]].*\$SECRET'
            'echo[[:space:]].*\$.*_KEY[^_]'
            'echo[[:space:]].*\$.*_TOKEN[^_]'
            'echo[[:space:]].*\$.*_PASSWORD'
            'printf[[:space:]].*\$DATABASE_URL'
            'env$'
            'printenv$'
          )

          FILES=$(git ls-files 'scripts/*.sh' 'scripts/*.ts' '.github/workflows/*.yml')

          for file in $FILES; do
            for pattern in "${DENY_PATTERNS[@]}"; do
              matches=$(grep -nE "$pattern" "$file" 2>/dev/null || true)
              if [[ -n "$matches" ]]; then
                echo "❌ Potential secret logging in $file:"
                echo "$matches"
                FOUND=1
              fi
            done
          done

          if [[ "$FOUND" -eq 1 ]]; then
            echo ""
            echo "Scripts must not echo secret-bearing variables. Use redacted forms (e.g. strip user:pass with \${VAR##*@})."
            exit 1
          fi

          echo "✅ No secret variable logging found in scripts or workflows."
