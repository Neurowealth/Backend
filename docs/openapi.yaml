                          type: number
                        positionId:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/user-yield:
    get:
      operationId: getUserYield
      summary: User yield summary
      description: Returns cumulative and period yield earned by the authenticated user.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
