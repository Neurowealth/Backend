                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/user-yield/export:
    get:
      operationId: exportUserYield
      summary: User yield summary (CSV export)
      description: |
        Same data as GET /analytics/user-yield, as a downloadable CSV — one
