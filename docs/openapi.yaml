# ─── Paths ────────────────────────────────────────────────────────────────────
paths:

  # ── Assistant endpoints (#318) ────────────────────────────────────────────────

  /assistant/chat:
    post:
      operationId: assistantChat
      summary: Send a message to the tool-calling assistant
      description: |
        Sends one message to the conversational assistant and returns its
        reply. The assistant may read live account data to ground its answer,
        or propose an action (deposit, withdraw, rebalance, adjust strategy,
        follow/unfollow a marketplace strategy, create a recurring deposit,
        create an alert rule) — action proposals are always previewed
        (dry-run) and returned as a confirmation prompt; the SAME action only
        executes once the caller's next message is an affirmative reply
        (`pendingConfirmation: true` on this response). A negative reply
        cancels it; anything else re-prompts without executing or dropping
        the pending action.

        **Sub-accounts**: pass `targetUserId` to act on a linked child
        account. The caller must hold an ACTIVE `SubAccount` link with the
        permission the specific proposed tool requires (same enforcement as
        `src/middleware/subAccount.ts`); a caller with no link, or the wrong
        permission, gets `403` before the message even reaches the model.

        **Degradation**: if the model is unavailable or the caller's token
        budget is exhausted, this still returns `200` with a graceful reply
        and `usedFallback: true` — never a `5xx` or a hang.
      tags: [Assistant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
            examples:
              read_only:
                summary: Open-ended read request
                value:
                  message: "what's my portfolio worth right now?"
              action_proposal:
                summary: A request that proposes an action
                value:
                  message: "withdraw 50 USDC"
              sub_account:
                summary: Acting on a linked sub-account
                value:
                  message: "what's the balance on my kid's account?"
                  targetUserId: "3f8e1c2a-4b5d-6e7f-8a9b-0c1d2e3f4a5b"
      responses:
        '200':
          description: The assistant's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatResponse'
              examples:
                grounded_answer:
                  summary: Grounded read-only answer
                  value:
                    reply: "Your portfolio is currently worth 150.00 USDC."
                    usedFallback: false
                    pendingConfirmation: false
                confirmation_prompt:
                  summary: Action proposed — awaiting confirmation
                  value:
                    reply: 'I''d like to: *Withdraw 50 USDC*. Reply "yes" to confirm or "no" to cancel.'
                    usedFallback: false
                    pendingConfirmation: true
                degraded:
                  summary: Model unavailable — graceful fallback
                  value:
                    reply: "I'm having trouble understanding requests like that right now. Please try a specific command (e.g. \"balance\", \"deposit 10\"), or try again shortly."
                    usedFallback: true
                    pendingConfirmation: false
        '400':
          description: Validation failed (empty/oversized message, malformed targetUserId).
        '401':
          description: Missing/invalid bearer token, or no permission on the requested sub-account.

  # ── Strategy What-If simulation (#344) ─────────────────────────────────────

  /strategies/simulate:
    post:
      operationId: simulateStrategy
      summary: Dry-run a hypothetical strategy change (what-if)
      description: |
        Simulates a hypothetical strategy config on the caller's current
        positions and public `ProtocolRate` history without applying it. Pure
        read — **zero side effects** (no outbox/event/log/transaction/DB write).

        Returns two legs:
          * `immediate` — what the agent would do right now (`rebalance` /
            `hold` / `blocked`) plus a `trace` shape-parity with the persisted
            `DecisionTrace`.
          * `historical` — a non-compounding daily replay over retained history,
            side-by-side with a counterfactual "held in the starting protocol"
            leg; rebalances subtract the live `estimateRebalanceCost`.

        Resolution precedence: followed config (current follow or
        `followStrategyId`) → submitted inline config → the caller's own config.
        The effective risk ceiling is always the stricter of the caller's and
        any applied ceiling. `followStrategyId` is mutually exclusive with an
        inline `strategy`/`targetAllocations`/`riskCeiling`.
      tags: [Strategy]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategySimulateRequest'
            examples:
              what_if:
                summary: Inline what-if
                value:
                  strategy: MAX_YIELD
                  riskCeiling: 70
                  historyWindowDays: 90
              follow_target:
                summary: Simulate the config of a followed strategy
                value:
                  followStrategyId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
      responses:
        '200':
          description: The what-if preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategySimulateResponse'
        '400':
          description: SimulationValidationError (weights do not sum to 100, GOAL_TRACKING without an active goal, window over cap, follow/inline conflict).
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: SimulationNotFoundError (unknown owner or unpublished follow target).
        '429':
          description: Rate limited (simulateRateLimiter, 6 req/min).

  # ── Risk endpoints ───────────────────────────────────────────────────────────

  /analytics/risk:
    get:
      operationId: getPortfolioRisk
      summary: Portfolio risk metrics
      description: |
        Returns VaR (95%/99%, historical and parametric), CVaR (95%/99%,
        historical), Sortino ratio, downside deviation, max drawdown (+duration),
        and annualised volatility for the authenticated user's portfolio.

        **Ownership**: `userId` is taken from the JWT payload — you cannot read
        another user's risk data via this endpoint.

        **Retention boundary**: YieldSnapshot rows are hard-deleted after 90 days
        by the snapshotter. Windows longer than the available history are
        relabelled with `insufficientHistory: true` and `actualWindowDays` set to
        the honest available span — never silently truncated.

        **Caching**: If a precomputed row < 1 hour old exists, it is returned
        directly (`source: "precomputed"`). Otherwise a live compute is performed
        (`source: "live"`).

        **Null contract**: metrics that cannot be computed return `null`, never
        `0`, `Infinity`, or `NaN`.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
          description: Analysis time window.
      responses:
        '200':
          description: Risk metrics for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioRiskResponse'
              examples:
                sufficient_history:
                  summary: User with 30d of data
                  value:
                    userId: '3f8e1c2a-4b5d-6e7f-8a9b-0c1d2e3f4a5b'
                    requestedWindow: '30d'
                    actualWindowDays: 30
                    insufficientHistory: false
                    dataFrom: '2026-07-21T00:00:00.000Z'
                    dataTo: '2026-08-20T00:00:00.000Z'
                    computedAt: '2026-08-20T12:00:00.000Z'
                    source: 'precomputed'
                    metrics:
                      sampleCount: 720
                      annualisedVolatility: 0.12
                      sortinoRatio: 1.85
                      downsideDeviation: 0.045
                      maxDrawdown: 0.08
                      maxDrawdownDuration: 14
                      varHistorical95: 0.031
                      varHistorical99: 0.065
                      varParametric95: 0.028
                      varParametric99: 0.044
                      cvarHistorical95: 0.052
                      cvarHistorical99: 0.078
                      beta: null
                      periodsPerYear: 8760
                insufficient_history:
                  summary: New user with < 7d data requesting 30d
                  value:
                    userId: '3f8e1c2a-4b5d-6e7f-8a9b-0c1d2e3f4a5b'
                    requestedWindow: '30d'
                    actualWindowDays: 3
                    insufficientHistory: true
                    dataFrom: '2026-08-17T00:00:00.000Z'
                    dataTo: '2026-08-20T00:00:00.000Z'
                    computedAt: '2026-08-20T12:00:00.000Z'
                    source: 'live'
                    metrics: null
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal server error.

  /analytics/risk/timeseries:
    get:
      operationId: getPortfolioRiskTimeseries
      summary: Portfolio risk timeseries (rolling volatility + drawdown)
      description: |
        Returns graph-ready rolling annualised volatility and running-peak
        drawdown series for the authenticated user's portfolio.

        **Ownership**: `userId` is taken from the JWT payload.

        **Null in rolling volatility**: points with fewer observations than
        `rollingWindow` have `volatility: null`.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
        - name: rollingWindow
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 30
            default: 7
          description: Number of observations per rolling volatility window.
      responses:
        '200':
          description: Timeseries data for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal server error.

  # ── Existing analytics endpoints ─────────────────────────────────────────────

  /analytics/correlation:
    get:
      operationId: getPortfolioCorrelation
      summary: Portfolio APY correlation matrix and diversification score
      description: |
        Returns the per-protocol APY correlation matrix and a weighted
        diversification score for the authenticated user's portfolio (#348).

        Correlation is computed from historical quoted APY levels
        (`ProtocolRate.supplyApy`), aligned to common days — it measures how
        synchronously protocols' yields have moved, NOT asset-price correlation,
        and does not model principal loss, depeg, or smart-contract failure. The
        `caveat` field ships with every response.

        `correlation[i][j]` is in [-1, 1]; degenerate (constant) series yield
        `null` rather than 0. The diversification score is 0-100 (higher = more
        diversified), `null` when fewer than 2 protocols have history.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [30d, 60d, 90d]
            default: 90d
      responses:
        '200':
          description: Correlation matrix and diversification score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  window:
                    type: string
                  computed:
                    type: boolean
                  observationCount:
                    type: integer
                  protocols:
                    type: array
                    items:
                      type: string
                  correlation:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                        nullable: true
                  averageCorrelation:
                    type: number
                    nullable: true
                  diversificationScore:
                    type: number
                    nullable: true
                  caveat:
                    type: string
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/factor-exposure:
    get:
      operationId: getFactorExposure
      summary: Rolling beta and market-factor exposure report
      description: |
        Measures how much of the authenticated user's yield movement is
        explained by the DeFi-yield "market factor" versus idiosyncratic
        protocol selection, on a rolling window so exposure can be seen
        changing over time (#352).

        The market is the canonical equal/TVL-weighted average of tracked
        `ProtocolRate` APY series (`src/analytics/benchmark.ts`). Each window
        regresses portfolio daily return on market daily return (OLS): a beta
        of ~1 means "your yield moves with the tracked-protocol market", ~0
        means "independent of it".

        This is YIELD co-movement, NOT price beta, and the market is not a
        traded index — the fixed `caveats[0]` states this on every response.
        Under-sampled (< 14 aligned days) or zero-market-variance windows
        report `null` beta/R², never 0 or NaN. Series are intersected on a
        shared daily grid (never zero-filled); mismatched days are dropped and
        `sampleCount` reflects the intersection.

        Retention is bounded at 90 days and `rollingWindow` must be shorter
        than `window`; a rolling window that leaves fewer than 2 windows
        returns the summary only, with a caveat. `inputHash` (sha256 of the
        sorted input snapshot) lets the report be reproduced deterministically.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [30d, 60d, 90d]
            default: 90d
        - name: rollingWindow
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 14d, 30d]
            default: 30d
        - name: weighting
          in: query
          required: false
          schema:
            type: string
            enum: [equal, tvl]
            default: equal
      responses:
        '200':
          description: Rolling beta and market-factor exposure report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  window:
                    type: string
                  rollingWindow:
                    type: string
                  weighting:
                    type: string
                    enum: [equal, tvl]
                  actualWindowDays:
                    type: integer
                  insufficientHistory:
                    type: boolean
                  sampleCount:
                    type: integer
                  rolling:
                    type: array
                    items:
                      type: object
                      properties:
                        windowEndMs:
                          type: integer
                        sampleCount:
                          type: integer
                        beta:
                          type: number
                          nullable: true
                        alpha:
                          type: number
                          nullable: true
                        alphaAnnualized:
                          type: number
                          nullable: true
                        rSquared:
                          type: number
                          nullable: true
                        idiosyncraticVolShare:
                          type: number
                          nullable: true
                  summary:
                    type: object
                    nullable: true
                    properties:
                      sampleCount:
                        type: integer
                      beta:
                        type: number
                        nullable: true
                      alpha:
                        type: number
                        nullable: true
                      alphaAnnualized:
                        type: number
                        nullable: true
                      rSquared:
                        type: number
                        nullable: true
                      idiosyncraticVolShare:
                        type: number
                        nullable: true
                  benchmark:
                    type: object
                    properties:
                      weighting:
                        type: string
                        enum: [equal, tvl]
                      universeSize:
                        type: integer
                      tvlFallback:
                        type: boolean
                  caveats:
                    type: array
                    items:
                      type: string
                  inputHash:
                    type: string
                  computedAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid query parameters (e.g. rollingWindow >= window).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/yield-breakdown:
    get:
      operationId: getYieldBreakdown
      summary: Yield base/incentive composition and effective APY
      description: |
        Returns the base (market) vs incentive (token-reward) split, incentive
        share, and haircuted effective APY for the authenticated user's held
        protocols (all protocols when they hold none) (#349).

        Effective APY = base + incentive × (1 − INCENTIVE_HAIRCUT); protocols
        with no decomposition fall back to the raw quoted supply APY. The
        `caveat` travels with every response, and `effectiveApyEnabled` reports
        whether `USE_EFFECTIVE_APY=true` is gating optimizer/agent consumption.
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Yield composition per held protocol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  effectiveApyEnabled:
                    type: boolean
                  caveat:
                    type: string
                  protocols:
                    type: array
                    items:
                      type: object
                      properties:
                        protocol:
                          type: string
                        asset:
                          type: string
                        network:
                          type: string
                        supplyApy:
                          type: number
                        baseApy:
                          type: number
                          nullable: true
                        incentiveApy:
                          type: number
                          nullable: true
                        incentiveShare:
                          type: number
                          nullable: true
                        effectiveApy:
                          type: number
                        rewardTokens:
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              symbol:
                                type: string
                              address:
                                type: string
                              apy:
                                type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/apy-history:
    get:
      operationId: getApyHistory
      summary: APY snapshot history
      description: |
        Returns APY snapshots over time for the authenticated user's positions.
        Graph-ready (sorted ascending by date).
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: APY history points.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  period:
                    $ref: '#/components/schemas/Period'
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        apy:
                          type: number
                        positionId:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/user-yield:
    get:
      operationId: getUserYield
      summary: User yield summary
      description: Returns cumulative and period yield earned by the authenticated user.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Yield summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  period:
                    $ref: '#/components/schemas/Period'
