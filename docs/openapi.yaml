  # ── Real-time WebSocket stream (#316) ─────────────────────────────────────────

  /ws:
    get:
      operationId: openRealtimeStream
      summary: Open the authenticated real-time event stream
      description: |
        Upgrades to a WebSocket carrying this user's live, sequence-numbered
        event stream. Not a REST endpoint: the only HTTP response a client
        should ever see is a rejection — success is a `101 Switching Protocols`
        followed by the JSON subprotocol below.

        Full client contract, including reconnect policy and worked examples:
        `docs/WEBSOCKET_STREAMING.md`.

        ### Authentication
        The same JWT + live-session check the REST middleware performs, run
        BEFORE the protocol switch — an unauthenticated peer gets a 401 and
        never becomes a WebSocket. There is no anonymous channel.

        Send the token either as `Authorization: Bearer <jwt>` (server-side
        clients) or as the subprotocol pair `Sec-WebSocket-Protocol: bearer,
        <jwt>` (browsers, which cannot set headers on a WebSocket). A `?token=`
        query parameter is deliberately NOT accepted: URLs reach access logs,
        proxy logs, and referrers, and this token is a live session.

        A session revoked while the socket is open closes it with code 4408 —
        the server rechecks the session periodically rather than trusting the
        handshake forever.

        ### Message flow
        1. Server sends `hello` with the topics you may read and `currentSeq`.
        2. Client sends `subscribe` (live from now) or `resume` (replay first).
        3. Server sends `event` frames; each carries a monotonic per-user `seq`.
        4. On reconnect, client sends `resume` with the highest `seq` it
           durably processed. Missed events replay, then live resumes.

        ### Delivery guarantees
        At-least-once, with a duplication window around a reconnect — dedupe on
        `seq`. Within a topic, events are ordered; across topics they are not.

        ### Heartbeat and idle policy
        The server pings every `heartbeatIntervalMs` (default 30s). A connection
        that neither pongs nor sends a frame for `WS_IDLE_TIMEOUT_MS` (default
        90s) is closed with code 4408. Clients that cannot observe protocol
        pongs may send `{"type":"ping"}` instead.

        ### Backpressure
        A slow consumer is never buffered without bound. Past the per-connection
        bound the server stops delivering, sends one `gap` frame with reason
        `backpressure`, and waits for a `resume`. Nothing is lost — the durable
        stream still holds every event.

        ### Limits
        Handshakes are rate-limited per source IP (`429` on the upgrade), client
        messages per connection (`rate_limited` error frame, then close 4429),
        and each user may hold `WS_MAX_CONNECTIONS_PER_USER` sockets per pod.

        ### Close codes
        | Code | Meaning |
        |------|---------|
        | 1000 | Normal closure |
        | 1001 | Server draining (preceded by a `draining` frame) |
        | 4401 | Unauthenticated |
        | 4403 | Actor not permitted |
        | 4408 | Session revoked, or idle timeout |
        | 4429 | Message rate limit exceeded |
      tags: [Realtime]
      security:
        - bearerAuth: []
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Bind the connection to a sub-account's stream instead of your own.
            The ACTIVE `SubAccount` grant is verified server-side and its
            permissions decide the readable topics (`VIEW` → portfolio,
            transactions, agent, alerts; `MANAGE_STRATEGY` → strategies).
            Same enforcement as the REST `actingAsUserId` routes; the client's
            opinion about its own scope is never consulted.
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          schema:
            type: string
            example: bearer, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Browser alternative to the Authorization header.
      requestBody:
        required: false
        description: |
          Not an HTTP body — documents the frames the client sends over the
          socket after the upgrade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSocketClientMessage'
      responses:
        '101':
          description: |
            Protocol switched. Every subsequent server frame is one of
            `WebSocketServerFrame`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketServerFrame'
        '401':
          description: Missing, malformed, expired, or revoked credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: No ACTIVE sub-account grant for the requested `actor`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Handshake rate limit, or too many concurrent connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  # ── Alert rules (#366) ────────────────────────────────────────────────────────

  /alerts:
    post:
      operationId: createAlertRule
      summary: Create a new alert rule
      description: |
        Create an alert rule to monitor a portfolio metric or protocol APY.
        Requires `alerts:manage` scope.
      tags: [Alerts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric, comparator, threshold, deliveryChannel]
              properties:
                metric:
                  type: string
                  enum: [PROTOCOL_APY, PORTFOLIO_VALUE]
                protocolName:
                  type: string
                  nullable: true
                  description: Required when metric is PROTOCOL_APY.
                comparator:
                  type: string
                  enum: [LT, GT, EQ]
                threshold:
                  type: string
                  description: Threshold as decimal string.
                deliveryChannel:
                  type: string
                  enum: [WEBHOOK, TELEGRAM, WHATSAPP, EMAIL]
                cooldownMinutes:
                  type: integer
                  description: Minutes between alert fires (default 60).
      responses:
        '201':
          description: Alert rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Validation failed.
        '401':
          description: Missing/invalid bearer token or insufficient scope.

  /alerts/{userId}:
    get:
      operationId: listAlertRules
      summary: List alert rules for a user
      description: Owner-scoped — caller may only list their own rules.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID (must match authenticated user).
      responses:
        '200':
          description: List of alert rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRule'
        '401':
          description: Missing/invalid bearer token or access denied.
        '403':
          description: Not the owner of the requested user ID.

  /alerts/{id}:
    patch:
      operationId: updateAlertRule
      summary: Update an alert rule
      description: Requires `alerts:manage` scope.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Alert rule ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric:
                  type: string
                  enum: [PROTOCOL_APY, PORTFOLIO_VALUE]
                protocolName:
                  type: string
                  nullable: true
                comparator:
                  type: string
                  enum: [LT, GT, EQ]
                threshold:
                  type: string
                deliveryChannel:
                  type: string
                  enum: [WEBHOOK, TELEGRAM, WHATSAPP, EMAIL]
                cooldownMinutes:
                  type: integer
                isActive:
                  type: boolean
      responses:
        '200':
          description: Alert rule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Validation failed.
        '401':
          description: Missing/invalid bearer token or insufficient scope.
        '404':
          description: Alert rule not found.

    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      description: Requires `alerts:manage` scope.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Alert rule ID.
      responses:
        '204':
          description: Alert rule deleted.
        '401':
          description: Missing/invalid bearer token or insufficient scope.
        '404':
          description: Alert rule not found.

  # ── User webhook endpoints (#368) ──────────────────────────────────────────

  /webhooks/endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Create a user webhook endpoint
      description: |
        Create a new outbound webhook endpoint for real-time event delivery.
        URL must be HTTPS and not point to localhost or private addresses.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS callback URL.
                events:
                  type: array
                  items:
                    type: string
                  description: Event types to subscribe to.
                topicScope:
                  type: string
                  nullable: true
                filterJson:
                  type: object
                  nullable: true
      responses:
        '201':
          description: Webhook endpoint created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserWebhookEndpoint'
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Signing secret (returned once; store securely).
        '400':
          description: Validation failed or invalid URL.
        '401':
          description: Missing/invalid bearer token.

    get:
      operationId: listWebhookEndpoints
      summary: List user webhook endpoints
      tags: [Webhooks]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of webhook endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWebhookEndpoint'
        '401':
          description: Missing/invalid bearer token.

  /webhooks/endpoints/{id}:
    get:
      operationId: getWebhookEndpoint
      summary: Get a webhook endpoint
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
      responses:
        '200':
          description: Webhook endpoint details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWebhookEndpoint'
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

    patch:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                topicScope:
                  type: string
                  nullable: true
                filterJson:
                  type: object
                  nullable: true
                isActive:
                  type: boolean
      responses:
        '200':
          description: Webhook endpoint updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWebhookEndpoint'
        '400':
          description: Validation failed.
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
      responses:
        '204':
          description: Webhook endpoint deleted.
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

  /webhooks/endpoints/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotate webhook endpoint secret
      description: |
        Begin secret rotation with dual-signing period. Returns new secret and
        activation time. Old secret remains valid until activation time.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
      responses:
        '200':
          description: Secret rotation initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretNext:
                    type: string
                    description: New secret (store securely).
                  secretNextActiveAt:
                    type: string
                    format: date-time
                    description: When new secret becomes active.
                  message:
                    type: string
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

  /webhooks/endpoints/{id}/test:
    post:
      operationId: testWebhookEndpoint
      summary: Send a test ping to webhook endpoint
      description: Sends a test event to verify endpoint is reachable and signature validation works.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
      responses:
        '200':
          description: Test event sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

  /webhooks/endpoints/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook event deliveries
      description: Lists recent delivery attempts for this endpoint with status and timestamps.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook endpoint ID.
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Maximum deliveries to return.
      responses:
        '200':
          description: List of delivery attempts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum: [PENDING, SUCCESS, FAILED]
                        event:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        completedAt:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: Webhook endpoint not found.

  # ── Private net worth and external wallets (#540) ─────────────────────────────

  /net-worth:
    get:
      operationId: getPrivateNetWorth
      summary: Get owner-private net worth
      description: |
        Combines active platform positions and read-only linked external wallet
        balances for the authenticated user only. Every holding is tagged with
        its source. External links are always unverified self-reported data;
        unpriced balances are null and stale snapshots carry an as-of timestamp.
        This data is not used in tax reports, agent decisions, or marketplace
        track records.
      tags: [Net Worth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private source-tagged holdings and valuation completeness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorthResponse'
        '401':
          description: Missing/invalid bearer token.

  /net-worth/external-wallets:
    get:
      operationId: listExternalWallets
      summary: List the caller's external Stellar wallet links
      tags: [Net Worth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owner-scoped external wallet links and sync freshness.
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalWalletLinkResponse'
        '401':
          description: Missing/invalid bearer token.

    post:
      operationId: linkExternalWallet
      summary: Link an external Stellar address as unverified and read-only
      description: |
        This does not prove address ownership and does not grant signing,
        transaction, or custody capability. The address is labeled
        UNVERIFIED_SELF_REPORTED and appears only in the caller's private views.
        The caller's platform-managed addresses cannot be linked as external.
        API keys must have the `portfolio:write` scope.
      tags: [Net Worth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWalletLinkRequest'
      responses:
        '201':
          description: External address linked; response explicitly marks it unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWalletLinkResponse'
        '400':
          description: Invalid Stellar public key or label.
        '401':
          description: Missing/invalid bearer token.
        '409':
          description: Address is already linked, platform-managed, or the per-user link limit is reached.

  /net-worth/external-wallets/{id}:
    delete:
      operationId: removeExternalWallet
      summary: Remove one of the caller's external wallet links
      description: Removal immediately excludes its balances from net-worth and opted-in goal calculations.
      tags: [Net Worth]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: External wallet link removed.
        '401':
          description: Missing/invalid bearer token.
        '404':
          description: External wallet not found for the caller.

  /portfolio/goals:
    post:
      operationId: createSavingsGoal
      summary: Create a savings goal
      description: External balances remain excluded unless `includeExternalHoldings` is explicitly true.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: Savings goal created.
        '400':
          description: Goal validation failed.
        '401':
          description: Missing/invalid bearer token.
        '409':
          description: Caller already has an active goal.

  /portfolio/goals/{id}:
    patch:
      operationId: updateSavingsGoal
      summary: Update a savings goal
      description: Set `includeExternalHoldings` to opt in or out; the default for existing goals is false.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdateRequest'
      responses:
        '200':
          description: Savings goal updated.
        '400':
          description: Goal validation failed.
        '401':
          description: Missing/invalid bearer token or the caller does not own the goal.
        '404':
          description: Goal not found.

  /portfolio/goals/{id}/progress:
    get:
      operationId: getSavingsGoalProgress
      summary: Get owner-scoped savings goal progress
      description: |
        When `includeExternalHoldings` is true, current known external value is
        included as a static contribution. The projection applies managed APY
        only to managed principal, and reports stale wallet and unpriced holding
        counts. The owner remains the only audience for unverified values.
      tags: [Portfolio]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Owner-only goal trajectory and external snapshot caveats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProgressResponse'
        '401':
          description: Missing/invalid bearer token or goal belongs to another user.
        '404':
          description: Goal not found.

  # ── Health ────────────────────────────────────────────────────────────────────

  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Always returns 200 once the process is running.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process alive.

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Returns 200 only when all background services are healthy.
      tags: [Health]
      security: []
      responses:
        '200':
          description: All services ready.
        '503':
          description: One or more services not ready.
