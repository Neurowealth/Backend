  # ── Agent decisions (#343) ────────────────────────────────────────────────────

  /agent/decisions:
    get:
      operationId: listAgentDecisions
      summary: List own rebalance decisions
      description: |
        Owner-scoped decision listing for the per-decision rationale ledger (#343).
        Visible iff the caller is in `affectedUserIds`; the response is projected
        to that user's view (no sibling `affectedUserIds`, no other user's position
        sizes). The decision is the batch evaluation that the agent loop ran for
        `protocol:strategy:followId` — REBALANCED, HELD, or BLOCKED — with the
        snapshotted thresholds, the APY inputs, the ranked candidates and their
        per-candidate rejection reasons, and — when the decision linked an
        `outboxOpId` — its current outbox `status` so the UI can explain
        “decided to rebalance → on-chain submission failed”.

        **Real-time counterpart**: every new decision row emits `agent.decision_recorded`
        on the same users' streams (seq-ordered, replayable).
      tags: [Agent]
      security:
        - bearerAuth: []
      parameters:
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [REBALANCED, HELD, BLOCKED]
        - name: fromProtocol
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on `createdAt`.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on `createdAt`.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, outcome, fromProtocol]
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated decision listing (user-projected).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      decisions:
                        type: array
                        items:
                          $ref: '#/components/schemas/RebalanceDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agent/decisions/{id}:
    get:
      operationId: getAgentDecision
      summary: Get one rebalance decision (full trace)
      description: |
        Full trace for a single decision, including the ranked `candidates`.
        Visible iff the caller is in `affectedUserIds`; otherwise 404.
      tags: [Agent]
      security:
